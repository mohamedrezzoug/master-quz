 const learned=Object.values(S.srs).filter(x=>x.b>=3).length;const box=[1,2,3,4,5,6].map(b=>Object.values(S.srs).filter(x=>x.b===b).length);
 const head=`<h1>☀️ ${tr("مراجعة اليوم","Révision du jour","Today's review","Heute lernen")}</h1><p class="sub">${tr("نظام لايتنر: البطاقة اللي كتعرفيها كترجع من بعد مدة أطول، واللي ما عرفتيهاش كترجع غدا.","Système de Leitner : une carte sue revient plus tard, une carte ratée revient demain.","Leitner system: cards you know come back later, cards you miss come back tomorrow.","Leitner-System: Gewusste Karten kommen später wieder, nicht gewusste schon morgen.")}</p>
 <div class="grid g3"><div class="card"><div class="small">${tr("للمراجعة اليوم","À réviser","Due today","Heute fällig")}</div><div class="stat">${due.length}</div></div><div class="card"><div class="small">${tr("جداد اليوم","Nouvelles","New today","Neu heute")}</div><div class="stat">${fresh.length}<small> / ${S.newPerDay}</small></div></div><div class="card"><div class="small">${tr("محفوظين مزيان","Bien maîtrisées","Well learned","Gut gelernt")}</div><div class="stat">${learned}<small> / ${all.length}</small></div></div></div>
 <div class="row" style="margin:12px 0;gap:4px">${box.map((n,i)=>`<span class="tag" title="Box ${i+1}">📦${i+1}: ${n}</span>`).join("")}<span class="small" style="margin-inline-start:8px">${tr("جداد فاليوم","Nouvelles/jour","New per day","Neue pro Tag")}: <input type="number" min="0" max="60" id="npd" class="in mono" value="${S.newPerDay}" style="width:64px;padding:3px 6px"></span></div>`;
 if(RV.i>=RV.q.length)return head+`<div class="card" style="text-align:center;padding:30px"><div style="font-size:46px">🎉</div><h3>${tr("سالات المراجعة ديال اليوم!","Révision du jour terminée !","Done for today!","Für heute geschafft!")}</h3><p class="small">${RV.done} ${tr("بطاقة","cartes","cards","Karten")}</p><div class="row" style="justify-content:center"><button class="btn" onclick="location.hash='endless'">∞ ${t("endless")}</button><button class="btn" id="rvMore">+ ${tr("زيد 10 جداد","10 nouvelles","10 more new","10 weitere")}</button></div></div>`;
 const c=RV.q[RV.i];const st=S.srs[c.id];SPK.rv=c.say||"";
 return head+`<div class="row between"><span class="small">${RV.i+1} / ${RV.q.length}</span>${st?`<span class="tag">📦 ${st.b}</span>`:`<span class="tag amb">${tr("جديدة","Nouvelle","New","Neu")}</span>`}</div>
 <div class="flash ${RV.flip?"flip":""}" id="rvCard" style="margin-top:8px"><div class="in3d"><div class="face">${c.front}${c.say?`<button class="btn sm spk" data-spk="rv" data-spl="de" style="margin-top:10px" onclick="event.stopPropagation()">🔊</button>`:""}</div><div class="face back">${c.back}</div></div></div>
 ${RV.flip?`<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-rv="0" style="border-color:var(--bad);color:var(--bad)">✗ ${tr("ما عرفتهاش","Pas su","Didn't know","Nicht gewusst")}</button><button class="btn" data-rv="1">~ ${tr("صعيبة","Difficile","Hard","Schwer")}</button><button class="btn pri" data-rv="2">✓ ${tr("عرفتها","Su","Knew it","Gewusst")}</button></div>`:`<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" id="rvFlip">${tr("بيّني الجواب","Voir la réponse","Show answer","Antwort zeigen")}</button></div>`}`;}
function rateCard(r){const c=RV.q[RV.i];const td=today();const st=S.srs[c.id]||{b:0,first:td};
 st.b=r===0?1:r===1?Math.max(1,st.b):Math.min(6,st.b+1);st.due=r===0?addDays(1):addDays(IVL[st.b]*(r===1?0.5:1)|0||1);S.srs[c.id]=st;RV.i++;RV.flip=false;RV.done++;persist();render();}

/* ---- Study time ---- */
function logMin(min,mod){const d=today();S.log[d]=S.log[d]||{};S.log[d][mod||"_"]=(S.log[d][mod||"_"]||0)+min;persist();}
const minOn=d=>Object.values(S.log[d]||{}).reduce((a,b)=>a+b,0);
function streak(){let n=0;for(let k=0;k<400;k++){const d=addDays(-k);if(minOn(d)>0)n++;else if(k>0)break;}return n;}
function weekChart(){const days=[...Array(7)].map((_,i)=>addDays(i-6));const mx=Math.max(S.goal,...days.map(minOn));const wd=S.lang==="ar"?["أح","إث","ثل","أر","خم","جم","سب"]:S.lang==="fr"?["Di","Lu","Ma","Me","Je","Ve","Sa"]:S.lang==="de"?["So","Mo","Di","Mi","Do","Fr","Sa"]:["Su","Mo","Tu","We","Th","Fr","Sa"];
 let s=`<line x1="20" y1="${130-S.goal/mx*110}" x2="540" y2="${130-S.goal/mx*110}" stroke="#e09a1a" stroke-dasharray="5 4"/><text x="538" y="${124-S.goal/mx*110}" text-anchor="end" font-size="11" fill="#8a5a06">${S.goal} min</text>`;
 days.forEach((d,i)=>{const v=minOn(d),h=v/mx*110,x=40+i*72;s+=`<rect x="${x}" y="${130-h}" width="44" height="${Math.max(h,2)}" rx="6" fill="${v>=S.goal?"#1f8a5b":"#20437c"}"/><text x="${x+22}" y="${124-h}" text-anchor="middle" font-size="11" fill="#16305a" font-weight="600">${v||""}</text><text x="${x+22}" y="148" text-anchor="middle" font-size="11" fill="#5d6878">${wd[new Date(d+"T12:00").getDay()]}</text>`;});
 return `<svg viewBox="0 0 560 156" class="dg" direction="ltr" style="width:100%;height:170px" preserveAspectRatio="xMidYMid meet">${s}</svg>`;}

/* ---- Exams ---- */
function daysTo(d){return Math.round((new Date(d+"T12:00")-new Date(today()+"T12:00"))/864e5);}
function nextExam(){return Object.entries(S.exams).filter(([k,d])=>d&&daysTo(d)>=0).sort((a,b)=>a[1]<b[1]?-1:1)[0];}
function phase(n){return n===0?tr("اليوم! بالتوفيق 🍀","Aujourd'hui ! Bonne chance 🍀","Today! Good luck 🍀","Heute! Viel Erfolg 🍀"):n<=7?tr("الأسبوع الأخير: تمارين مخلطة، ورقة القوانين، تأكدي من القاعة والمدة.","Dernière semaine : exercices mixtes, formulaire, vérifier salle et durée.","Last week: mixed practice, formula sheet, confirm room and duration.","Letzte Woche: gemischte Übungen, Formelblatt, Raum und Dauer prüfen."):n<=28?tr("مرحلة 4 أسابيع: لائحة المواضيع، تمارين بالتوقيت، شرحي بصوت عالي.","Phase 4 semaines : liste des thèmes, exercices chronométrés, expliquer à voix haute.","4-week phase: topic checklist, timed exercises, explain aloud.","4-Wochen-Phase: Themenliste, Übungen auf Zeit, laut erklären."):tr("مازال الوقت: تبعي دورة الدراسة من بعد كل محاضرة.","Encore du temps : suivre le cycle d'étude après chaque cours.","Plenty of time: follow the study cycle after each lecture.","Noch Zeit: nach jeder Vorlesung den Lernzyklus durchlaufen.");}
function examsBlock(){return `<h2>📅 ${tr("مواعيد الامتحانات","Dates d'examen","Exam dates","Prüfungstermine")}</h2><p class="small">${tr("دخلي التاريخ ديال كل امتحان (من StudiLöwe) باش يبان العد التنازلي والمرحلة.","Saisissez la date de chaque examen (StudiLöwe) pour voir le compte à rebours.","Enter each exam date (from StudiLöwe) to see the countdown and phase.","Trage die Prüfungstermine (aus StudiLöwe) ein, um Countdown und Lernphase zu sehen.")}</p>
 <div class="card" style="padding:0;overflow:auto"><table><tr><th>${t("module")}</th><th>${tr("التاريخ","Date","Date","Datum")}</th><th>${tr("باقي","Reste","Left","Noch")}</th><th>${tr("المرحلة","Phase","Phase","Phase")}</th></tr>${MODS.map(m=>{const d=S.exams[m.id];const n=d?daysTo(d):null;return `<tr><td>${esc(mname(m))}</td><td><input type="date" class="in" data-exd="${m.id}" value="${d||""}" style="padding:4px 6px;max-width:160px"></td><td class="mono" style="white-space:nowrap">${n==null?"—":n<0?"✓":n+" d"}</td><td class="small">${n==null||n<0?"":phase(n)}</td></tr>`;}).join("")}</table></div>`;}

/* ---- Formula sheet ---- */
const CFORM=[["ssgb",["DPMO = defects / (units × opportunities) × 10⁶","Cp = (USL − LSL) / 6σ","Cpk = min[(USL − μ)/3σ ; (μ − LSL)/3σ]","RTY = Π yieldᵢ"]]];
function formulaSheet(){return MODS.map(m=>`<div class="card fsec"><h3>${esc(mname(m))} <span class="small de">${esc(m.de)}</span></h3>${m.f.map(f=>`<div class="formula">${esc(f)}</div>`).join("")}</div>`).join("")+CFORM.map(([id,fs])=>`<div class="card fsec"><h3>🎓 ${esc(nameOf(id))}</h3>${fs.map(f=>`<div class="formula">${esc(f)}</div>`).join("")}</div>`).join("");}
function vFormeln(){return `<div class="row between"><h1>📐 ${tr("ورقة القوانين","Formulaire","Formula sheet","Formelsammlung")}</h1>${pdfBtn("formulas","")}</div><p class="sub">${tr("جميع القوانين ديال المواد فبلاصة وحدة — مزيانة للمراجعة قبل الامتحان (تأكدي واش مسموح بيها فالامتحان).","Toutes les formules au même endroit — vérifiez si le formulaire est autorisé à l'examen.","All formulas in one place — check whether a formula sheet is allowed in the exam.","Alle Formeln an einem Ort — prüfe, ob ein Formelblatt in der Prüfung erlaubt ist.")}</p><div class="grid g2">${formulaSheet()}</div>`;}

document.addEventListener("click",e=>{const g=s=>e.target.closest(s);let el;
 if(g("#rvFlip")||(g("#rvCard")&&!g("[data-spk]"))){RV.flip=!RV.flip;render();return;}
 if(el=g("[data-rv]")){rateCard(+el.dataset.rv);return;}
 if(g("#rvMore")){S.newPerDay+=10;RV.q=null;persist();render();return;}
 if(g("#logPlus")){logMin(25,tm.mod);toast("+25 min");render();return;}
});
document.addEventListener("change",e=>{const el=e.target;
 if(el.dataset.exd){S.exams[el.dataset.exd]=el.value;persist();render();}
 if(el.id==="npd"){S.newPerDay=Math.max(0,+el.value||0);RV.q=null;persist();render();}
 if(el.id==="goalIn"){S.goal=Math.max(10,+el.value||90);persist();render();}
 if(el.id==="tmMod"){tm.mod=el.value;}
});

const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function IOS_HINT(){if(!isIOS||isStandalone()||S.iosHintOff)return "";return `<div class="notice" style="margin-bottom:14px;display:flex;gap:10px;align-items:center"><span style="font-size:26px">📲</span><div style="flex:1">${tr("باش تنصبي التطبيق فالآيفون: ضغطي على زر المشاركة ⬆️ تحت فـ Safari، ومن بعد «Sur l'écran d'accueil / Zum Home-Bildschirm».","Pour installer sur iPhone : touchez Partager ⬆️ dans Safari, puis « Sur l'écran d'accueil ».","To install on iPhone: tap Share ⬆️ in Safari, then “Add to Home Screen”.","Auf dem iPhone installieren: in Safari auf Teilen ⬆️ tippen, dann „Zum Home-Bildschirm“.")}</div><button class="btn sm ghost" onclick="S.iosHintOff=1;persist();render()">✕</button></div>`;}
/* ---- PWA: install button, voice search, service worker ---- */
let deferredPrompt=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById("instBtn");if(b)b.style.display="";});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;toast("✓ App installiert");});
document.addEventListener("click",async e=>{
 if(e.target.closest("#instBtn")&&deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;e.target.closest("#instBtn").style.display="none";return;}
 if(e.target.closest("#micBtn")&&SR){const r=new SR();r.lang={de:"de-DE",ar:"ar-MA",fr:"fr-FR",en:"en-US"}[S.lang]||"de-DE";r.interimResults=false;const b=e.target.closest("#micBtn");b.textContent="🔴";
  r.onresult=ev=>{const q=ev.results[0][0].transcript;const i=document.getElementById("gsq");if(i){i.value=q;i.dispatchEvent(new Event("input",{bubbles:true}));}};
  r.onend=()=>{b.textContent="🎤";};r.onerror=()=>{b.textContent="🎤";toast("🎤 ✗");};try{r.start();}catch(_){b.textContent="🎤";}}
});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
/* ============ RENDER ============ */
function render(){
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";document.body.classList.toggle("ltr",S.lang!=="ar");
  $("#nav").innerHTML=navHTML();$("#mobnav").innerHTML=navHTML();$("#langs").innerHTML=langHTML();
  const v=cur();
  const map={heute:vHeute,formeln:vFormeln,endless:()=>`<h1>∞ ${t("endless")}</h1>`+vEndless(),files:vFiles,certs:()=>cExam?examHTML():vCerts(),schedule:vSchedule,home:vHome,modules:vModules,tools:vTools,practice:vPractice,errors:vErrors,exams:vExams,thesis:vThesis,plan:vPlan,glossary:vGlossary};
  $("#main").innerHTML=`<div class="moblang">${langHTML()}</div>`+map[v]();
  syncLabel();
  if(v==="tools"){CALCS.forEach(c=>runCalc(c.id));if(calcFocus){const el=$("#calc-"+calcFocus);if(el)el.scrollIntoView({block:"center"});calcFocus=null;}}
}
window.addEventListener("hashchange",()=>{explLang=null;render();window.scrollTo(0,0);});

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const g=s=>e.target.closest(s);let el;
  if(el=g("[data-lang]")){S.lang=el.dataset.lang;persist();render();return;}
  if(el=g("[data-cyc]")){const [id,i]=el.dataset.cyc.split("|");S.cycle[id]=S.cycle[id]||[];S.cycle[id][i]=!S.cycle[id][i];persist();render();return;}
  if(el=g("[data-xl]")){explLang=el.dataset.xl;render();return;}
  if(el=g("[data-ans]")){const ex=el.closest(".ex");ex.classList.toggle("open");el.textContent=ex.classList.contains("open")?t("hideAns"):t("showAns");return;}
  if(el=g("[data-pt]")){pTab=el.dataset.pt;render();return;}
  if(el=g("[data-deck]")){deck=el.dataset.deck;fi=0;order=null;render();return;}
  if(g("#flash")){$("#flash").classList.toggle("flip");return;}
  if(el=g("[data-fc]")){const n=deckItems().length,a=el.dataset.fc;
    if(a==="next")fi=(fi+1)%n;else if(a==="prev")fi=(fi-1+n)%n;else if(a==="shuffle"){order=shuffle(deckItems().map((_,i)=>i));fi=0;}
    else{S.cards[deck+":"+order[fi%n]]=a==="know";persist();fi=(fi+1)%n;}
    render();return;}
  if(el=g("[data-opt]")){if(answered)return;answered=true;const q=qs[qi];const i=+el.dataset.opt;const ok=q.opts[i].c;if(ok)qScore++;
    document.querySelectorAll("[data-opt]").forEach((b,j)=>{if(q.opts[j].c)b.classList.add("good");else if(j===i)b.classList.add("bad");b.disabled=true;});
    $("#qexp").innerHTML=`<div class="res ${ok?"":"err"}" style="font-family:inherit">${ok?"✓":"✗"} ${esc(q.e)}</div><div class="row" style="margin-top:10px"><button class="btn pri" data-q="next">${t("next")} →</button>${ok?"":`<button class="btn sm" data-q="log">✎ ${t("logError")}</button>`}</div>`;return;}
  if(el=g("[data-q]")){const a=el.dataset.q;if(a==="next"){qi++;answered=false;}else if(a==="restart"){newQuiz();}else if(a==="log"){const q=qs[qi];S.errors.push({at:Date.now(),mod:q.m,mis:q.q,cor:q.opts.find(o=>o.c).o+" — "+q.e,les:"",done:false});persist();toast(t("saved"));return;}render();return;}
  if(el=g("#eSave")){const mis=$("#eMis").value.trim(),cor=$("#eCor").value.trim(),les=$("#eLes").value.trim();if(!mis&&!cor)return;S.errors.push({at:Date.now(),mod:$("#eMod").value,mis,cor,les,done:false});errPre=null;persist();toast(t("saved"));render();return;}
  if(el=g("[data-ef]")){errFilter=el.dataset.ef;render();return;}
  if(el=g("[data-edone]")){const x=S.errors.find(r=>r.at==el.dataset.edone);x.done=!x.done;persist();render();return;}
  if(el=g("[data-edel]")){S.errors=S.errors.filter(r=>r.at!=el.dataset.edel);persist();render();return;}
  if(el=g("[data-ck]")){const k=el.dataset.ck;S.check[k]=!S.check[k];persist();el.classList.toggle("on");return;}
  if(el=g("[data-tm]")){tm.mode=el.dataset.tm;tm.left=(tm.mode==="focus"?tm.focusMin:tm.breakMin)*60;render();return;}
  if(g("#tmGo")){if(tm.run){clearInterval(tm.iv);tm.run=false;}else{tm.iv=setInterval(tick,1000);tm.run=true;}render();return;}
  if(g("#tmRe")){clearInterval(tm.iv);tm.run=false;tm.left=(tm.mode==="focus"?tm.focusMin:tm.breakMin)*60;render();return;}
  if(g("#bkCopy")){const j=JSON.stringify(S);navigator.clipboard.writeText(j).then(()=>toast(t("copied"))).catch(()=>{$("#bkIn").value=j;$("#bkIn").select();});return;}
  if(g("#bkRestore")){try{const d=JSON.parse($("#bkIn").value);if(typeof d!=="object"||!d)throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEF)),d);persist();toast(t("restored"));render();}catch(err){toast(t("bad"));}return;}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.calc){runCalc(el.dataset.calc);return;}
  if(el.id==="note"){S.notes[el.dataset.mod]=el.value;persist();return;}
  if(el.dataset.ects!==undefined){S.ects[el.dataset.ects]=Math.max(0,+el.value||0);persist();return;}
  if(el.id==="gq"){const q=el.value.toLowerCase();document.querySelectorAll("#gt tr").forEach((r,i)=>{if(i)r.style.display=r.textContent.toLowerCase().includes(q)?"":"none";});return;}
  if(el.id==="tmF"||el.id==="tmB"){tm.focusMin=Math.max(5,+$("#tmF").value||25);tm.breakMin=Math.max(1,+$("#tmB").value||5);if(!tm.run)tm.left=(tm.mode==="focus"?tm.focusMin:tm.breakMin)*60;const v=$("#tmv");if(v)v.textContent=fmtT(tm.left);}
});
document.addEventListener("change",e=>{
  if(e.target.id==="qmod"){quizMod=e.target.value;newQuiz();render();}
  if(e.target.dataset.ects!==undefined)render();
});

render();
initCloud();
</script>
