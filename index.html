<style>
:root{
  --navy:#16305a;--navy2:#20437c;--ink:#1c2433;--muted:#5d6878;--line:#e3e7ee;--bg:#f5f6f9;--card:#fff;
  --accent:#e09a1a;--accent-soft:#fdf3e1;--ok:#1f8a5b;--ok-soft:#e5f5ed;--bad:#c2412d;--bad-soft:#fbeae6;--blue-soft:#e8eef8;
  --r:14px;--shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
[dir=ltr] body,body.ltr{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;direction:ltr;unicode-bidi:isolate}
.ltrtxt{direction:ltr;text-align:left;unicode-bidi:isolate}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--navy);color:#dfe7f5;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{padding:4px 10px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.brand b{display:block;color:#fff;font-size:17px;letter-spacing:.2px}
.brand small{opacity:.7;font-size:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:#fff;color:var(--navy)}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:12px;opacity:.8;padding:10px}
.langs{display:flex;gap:4px;margin-top:6px}
.langs button{flex:1;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:8px;padding:4px 0;font-size:12px}
.langs button.on{background:var(--accent);border-color:var(--accent);color:#1a1a1a}
main{padding:28px clamp(16px,4vw,44px) 90px;max-width:1080px;width:100%}
h1{font-size:26px;margin:0 0 4px;color:var(--navy);line-height:1.3}
h2{font-size:19px;margin:28px 0 12px;color:var(--navy)}
h3{font-size:16px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.click{cursor:pointer;transition:transform .12s,border-color .12s}
.card.click:hover{transform:translateY(-2px);border-color:#b9c6dc}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--blue-soft);color:var(--navy2);font-weight:600}
.tag.amb{background:var(--accent-soft);color:#8a5a06}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.bar{height:8px;background:#e8ecf2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),#3d6fb8);border-radius:99px;transition:width .3s}
.bar.amb i{background:linear-gradient(90deg,#d48b0c,#f0b445)}
.stat{font-size:30px;font-weight:700;color:var(--navy);line-height:1.1}
.stat small{font-size:14px;color:var(--muted);font-weight:500}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--navy)}
.btn:hover{border-color:#b9c6dc}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:var(--navy2)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.tabs{display:flex;gap:4px;background:#eef1f6;padding:4px;border-radius:11px;width:max-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.formula{background:#f7f9fc;border:1px solid var(--line);border-inline-start:4px solid var(--navy2);border-radius:10px;padding:12px 14px;font-family:"IBM Plex Mono",monospace;font-size:14px;direction:ltr;text-align:left;white-space:pre-wrap}
.example{background:var(--accent-soft);border-radius:10px;padding:12px 14px;direction:ltr;text-align:left}
.ex{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;direction:ltr;text-align:left}
.ex .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--ok)}
.ex.open .a{display:block}
.ex button{margin-top:6px}
.steps{display:grid;gap:6px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;user-select:none}
.chk:hover{border-color:#b9c6dc}
.chk .box{width:20px;height:20px;border-radius:6px;border:2px solid #b8c3d4;flex:none;display:grid;place-items:center;margin-top:2px}
.chk.on .box{background:var(--ok);border-color:var(--ok)}
.chk.on .box::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk.on span{color:var(--muted);text-decoration:line-through}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.in{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
.in:focus{outline:2px solid #9fb6dc;border-color:transparent}
textarea.in{min-height:80px;resize:vertical}
.res{margin-top:12px;background:var(--ok-soft);border-radius:10px;padding:10px 14px;direction:ltr;text-align:left;font-family:"IBM Plex Mono",monospace;font-size:13.5px;white-space:pre-wrap}
.res.err{background:var(--bad-soft);color:var(--bad)}
.flash{perspective:1200px;height:240px;cursor:pointer}
.flash .in3d{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .in3d{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--navy);color:#fff}
.face .big{font-size:26px;font-weight:700}
.opt{display:block;width:100%;text-align:start;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:8px;direction:ltr;text-align:left}
.opt:hover{border-color:#9fb6dc}
.opt:disabled{color:var(--ink);cursor:default}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--muted);font-size:12.5px;font-weight:600;background:#f8f9fb}
.notice{background:var(--blue-soft);border-radius:12px;padding:12px 16px;color:var(--navy);font-size:14px}
.notice.amb{background:var(--accent-soft);color:#7a4f05}
.timer{font-size:56px;font-weight:700;color:var(--navy);text-align:center;font-family:"IBM Plex Mono",monospace;letter-spacing:2px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;direction:ltr}
.flow span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px}
.flow em{color:var(--accent);font-style:normal;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:24px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.mobnav{display:none}
.de{color:var(--navy2);font-weight:600}
.small{font-size:13px;color:var(--muted)}
.ring{width:54px;height:54px;flex:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);z-index:40;overflow-x:auto;padding:6px 4px env(safe-area-inset-bottom)}
  .mobnav a{flex:1 0 auto;min-width:64px;color:#c9d5ea;text-decoration:none;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:8px}
  .mobnav a.on{color:#fff;background:rgba(255,255,255,.12)}
  .mobnav svg{width:20px;height:20px}
  .moblang{display:flex!important}
  h1{font-size:22px}
}
.cico{width:40px;height:40px;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px;flex:none;font-family:"IBM Plex Sans",sans-serif}
.opt.sel{background:var(--blue-soft);border-color:var(--navy2)}
details.lesson summary{cursor:pointer;list-style:none}
details.lesson summary::-webkit-details-marker{display:none}
details.lesson summary::before{content:"▸ ";color:var(--accent)}
details.lesson[open] summary::before{content:"▾ "}
.tt{display:grid;grid-template-columns:52px repeat(5,1fr);gap:0 6px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.tth{font-weight:600;color:var(--navy);text-align:center;padding-bottom:8px;font-size:13px}
.ttt div{font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.ttc{position:relative;background:repeating-linear-gradient(to bottom,#f3f5f8 0,#f3f5f8 1px,transparent 1px,transparent 56px);border-radius:8px}
.sb{position:absolute;background:var(--blue-soft);border-inline-start:4px solid var(--navy2);border-radius:8px;padding:5px 7px;font-size:11.5px;line-height:1.35;overflow:hidden;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;gap:2px}
.sb b{font-size:12px;color:var(--navy)}
.sb:hover{filter:brightness(.97)}
.sb.off{background:#f6f2f1;border-color:#c2412d;opacity:.8}
.ttlist{display:none}
@media (max-width:860px){.ttwrap{display:none}.ttlist{display:block}}
.fig{margin:0 0 14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.fig svg{width:100%;height:auto;display:block}
.dg text{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}
.fig figcaption{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px;direction:ltr}
.figs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.long p{font-size:15.5px;line-height:1.75}
.spk.on{background:var(--accent-soft);border-color:var(--accent)}
.gsearch{position:relative;margin:0 0 18px}
.gsr{position:absolute;z-index:30;left:0;right:0;top:44px;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(20,30,50,.15);max-height:420px;overflow:auto}
.gsi{display:block;padding:10px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.gsi:hover{background:var(--blue-soft)}
.gsi .small{display:block}
.gsn{direction:ltr;text-align:left;opacity:.8}
.drop{display:block;border:2px dashed #b9c6dc;border-radius:16px;padding:22px;text-align:center;background:#fff;cursor:pointer}
.drop.hov,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.pdfwrap{position:fixed;left:-10000px;top:0}
.pdfdoc{width:690px;box-sizing:border-box;background:#fff;color:#1c2433;padding:10px 16px;font-size:13px;line-height:1.55}
.pdfdoc h1{font-size:22px;margin:4px 0}.pdfdoc h2{font-size:16px;margin:16px 0 6px;color:#16305a}.pdfdoc h3{margin:0 0 6px;color:#20437c}
.pdfdoc .fig{border:1px solid #e3e7ee}
.pdfhead{font-size:10px;color:#5d6878;border-bottom:1px solid #e3e7ee;margin-bottom:8px;padding-bottom:4px}
.pgb{page-break-before:always;height:0}
.art{font-weight:700}
.fsec h3{margin-bottom:10px}
.fsec .formula{margin-bottom:8px}
.moblang{display:none;gap:4px;margin-bottom:12px}
.moblang button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;font-size:12px}
.moblang button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
</style>
</head>

let DB=null,DOC=null,cloud=false,saveT=null,lastSent="";
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(DOC){clearTimeout(saveT);saveT=setTimeout(async()=>{const j=JSON.stringify(S);if(j===lastSent)return;try{await DOC.set({json:j,at:Date.now()});lastSent=j;}catch(e){}},900);}
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const user=await claude.use("user");DB=await claude.use("db");
    if(!DB||!user)return;
    const id=await user.id();if(!id)return;
    DOC=DB.collection("data/users/"+id).doc("state");
    const snap=await Promise.race([DOC.get(),new Promise((_,r)=>setTimeout(()=>r("t"),10000))]);
    const d=snap&&(snap.data?snap.data():snap);
    if(d&&d.json){const remote=JSON.parse(d.json);lastSent=d.json;S=Object.assign(JSON.parse(JSON.stringify(DEF)),remote);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}render();}
    else{persist();}
    cloud=true;syncLabel();
  }catch(e){}
}

/* --- calculators --- */
let calcFocus=null;
const CALCS=[
{id:"rel",mod:"tz",title:"R(t) = e^(−λt)",fields:[["λ (1/h)","2e-4"],["t (h)","1000"]],run:([l,tt])=>{const R=Math.exp(-l*tt);return `λt   = ${fx(l*tt)}\nR(t) = ${fx(R)}  (${(R*100).toFixed(2)} %)\nF(t) = ${fx(1-R)}  (${((1-R)*100).toFixed(2)} %)\nMTTF = 1/λ = ${fx(1/l)} h`;}},
{id:"sp",mod:"tz",title:"Series / Parallel",fields:[["R₁, R₂, R₃ … (comma)","0.98, 0.95"]],raw:true,run:([s])=>{const r=s.split(/[,;\s]+/).filter(Boolean).map(Number);if(!r.length||r.some(x=>isNaN(x)||x<0||x>1))throw 0;const ser=r.reduce((a,b)=>a*b,1),par=1-r.reduce((a,b)=>a*(1-b),1);return `n = ${r.length}\nSeries   R = ΠRᵢ        = ${fx(ser)} (${(ser*100).toFixed(2)} %)\nParallel R = 1−Π(1−Rᵢ) = ${fx(par)} (${(par*100).toFixed(3)} %)`;}},
{id:"fluid",mod:"tsd",title:"p = p₀ + ρgh",fields:[["ρ (kg/m³)","1000"],["h (m)","3"],["g (m/s²)","9.81"],["p₀ (Pa)","101325"]],run:([r,h,g,p0])=>{const pg=r*g*h;return `Gauge    = ρgh = ${fx(pg)} Pa = ${(pg/1000).toFixed(3)} kPa\nAbsolute = ${fx(pg+p0)} Pa = ${((pg+p0)/1000).toFixed(3)} kPa`;}},
{id:"cont",mod:"tsd",title:"A₁v₁ = A₂v₂",fields:[["A₁","4"],["v₁ (m/s)","2"],["A₂ (same unit)","2"]],run:([a1,v1,a2])=>`v₂ = A₁·v₁/A₂ = ${fx(a1*v1/a2)} m/s\nQ  = A₁·v₁ = ${fx(a1*v1)} (area unit · m/s)`},
{id:"cplx",mod:"math",title:"z = a + jb",fields:[["a","3"],["b","4"]],run:([a,b])=>{const m=Math.hypot(a,b),th=Math.atan2(b,a);return `|z| = √(a²+b²) = ${fx(m)}\nθ   = atan2(b,a) = ${(th*180/Math.PI).toFixed(3)}° = ${fx(th)} rad\nPolar: z = ${fx(m)}·(cos ${(th*180/Math.PI).toFixed(2)}° + j·sin ${(th*180/Math.PI).toFixed(2)}°)\nConjugate: ${fx(a)} ${b>=0?"−":"+"} j${fx(Math.abs(b))}`;}},
{id:"kin",mod:"mech",title:"v = u + at · s = ut + ½at²",fields:[["u (m/s)","2"],["a (m/s²)","2"],["t (s)","4"]],run:([u,a,tt])=>`v = u + a·t     = ${fx(u+a*tt)} m/s\ns = u·t + ½a·t² = ${fx(u*tt+.5*a*tt*tt)} m\nCheck v² = u² + 2as → ${fx(u*u+2*a*(u*tt+.5*a*tt*tt))} = ${fx((u+a*tt)**2)}`},
{id:"stats",mod:"da",title:"x̄, s², s, CI 95 %",fields:[["Data (comma / space)","8, 10, 12"]],raw:true,run:([s])=>{const x=s.split(/[,;\s]+/).filter(Boolean).map(Number);if(x.length<2||x.some(isNaN))throw 0;const n=x.length,m=x.reduce((a,b)=>a+b,0)/n,v=x.reduce((a,b)=>a+(b-m)**2,0)/(n-1),sd=Math.sqrt(v),se=sd/Math.sqrt(n),tv=n-1<=30?TT[n-1]:1.96;return `n   = ${n}\nx̄   = ${fx(m)}\ns²  = ${fx(v)}\ns   = ${fx(sd)}\nmin = ${Math.min(...x)}   max = ${Math.max(...x)}\nCI 95 % (t, df=${n-1}, t=${tv}) = ${fx(m)} ± ${fx(tv*se)}  →  [${fx(m-tv*se)} ; ${fx(m+tv*se)}]\nCI 95 % (z = 1.96)             = [${fx(m-1.96*se)} ; ${fx(m+1.96*se)}]`;}}
];
const TT=[0,12.706,4.303,3.182,2.776,2.571,2.447,2.365,2.306,2.262,2.228,2.201,2.179,2.160,2.145,2.131,2.120,2.110,2.101,2.093,2.086,2.080,2.074,2.069,2.064,2.060,2.056,2.052,2.048,2.045,2.042];
function fx(v){if(!isFinite(v))return "—";const a=Math.abs(v);if(a!==0&&(a<1e-3||a>=1e6))return v.toExponential(4);return (+v.toFixed(5)).toString();}

function examHTML(){
 const x=cExam,c=CERTS.find(z=>z.id===x.id);
 if(x.done){const p=Math.round(x.score/x.qs.length*100),ok=p>=c.sim.pass;
  return `<h1 class="ltrtxt">${c.name}</h1><div class="card" style="text-align:center"><div style="font-size:48px">${ok?"🎉":"📘"}</div><div class="stat" style="font-size:44px">${p}%</div><div class="small">${x.score} / ${x.qs.length} · ${tr("النجاح","réussite","pass")} ${c.sim.pass}%</div><h3 style="color:${ok?"var(--ok)":"var(--bad)"};margin-top:10px">${ok?tr("ناجحة ✓","Réussi ✓","Passed ✓"):tr("مازال — عاودي الدروس","Pas encore — revoir les leçons","Not yet — review the lessons")}</h3><div class="row" style="justify-content:center"><button class="btn pri" data-cexam="${c.id}">${t("restart")}</button><button class="btn" data-cexit>${t("back")}</button></div></div>

 const q=x.qs[x.i];
 return `<div class="row between"><h1 class="ltrtxt" style="margin:0">${c.name}</h1><div class="timer" id="cxT" style="font-size:28px">${fmtT(x.left)}</div></div>

 <div class="row" style="margin-top:10px;gap:4px">${x.qs.map((_,j)=>`<button class="btn sm" data-cxj="${j}" style="min-width:34px;${j===x.i?"border-color:var(--navy);":""}${x.ans[j]!=null?"background:var(--blue-soft)":""}">${j+1}</button>`).join("")}</div>`;
}
function startExam(id){const c=CERTS.find(z=>z.id===id);const pool=shuffle(QUIZ.filter(q=>q[0]===id)).slice(0,c.sim.n);
 clearInterval(cExam&&cExam.iv);cExam={id,i:0,ans:[],left:c.sim.min*60,score:0,done:false,qs:pool.map(q=>({q:q[1],e:q[4],opts:shuffle(q[2].map((o,i)=>({o,c:i===q[3]})))}))};
 cExam.iv=setInterval(()=>{if(!cExam||cExam.done)return;cExam.left--;const el=$("#cxT");if(el)el.textContent=fmtT(cExam.left);if(cExam.left<=0)endExam();},1000);render();}
function endExam(){const x=cExam;clearInterval(x.iv);x.score=x.qs.reduce((a,q,i)=>a+(x.ans[i]!=null&&q.opts[x.ans[i]].c?1:0),0);x.done=true;const p=Math.round(x.score/x.qs.length*100);
 if(S.cards["best-"+x.id]==null||p>S.cards["best-"+x.id])S.cards["best-"+x.id]=p;
 x.qs.forEach((q,i)=>{if(!(x.ans[i]!=null&&q.opts[x.ans[i]].c))S.errors.push({at:Date.now()+i,mod:x.id,mis:q.q+(x.ans[i]!=null?" → "+q.opts[x.ans[i]].o:""),cor:q.opts.find(o=>o.c).o+" — "+q.e,les:"",done:false});});
 persist();render();window.scrollTo(0,0);}
document.addEventListener("click",e=>{const g=s=>e.target.closest(s);let el;
 if(el=g("[data-cexam]")){startExam(el.dataset.cexam);window.scrollTo(0,0);return;}
 if(!cExam)return;
 if(g("[data-cexit]")){cExam=null;render();return;}
 if(el=g("[data-cxa]")){cExam.ans[cExam.i]=+el.dataset.cxa;if(cExam.i<cExam.qs.length-1)cExam.i++;render();return;}
 if(el=g("[data-cxn]")){cExam.i+=+el.dataset.cxn;render();return;}
 if(el=g("[data-cxj]")){cExam.i=+el.dataset.cxj;render();return;}
 if(g("[data-cxend]")){endExam();return;}
},true);

const LONG={
tz:{img:["relCurve","bathtub","seriesParallel","faultTree"],
de:"Die Zuverlässigkeit R(t) ist die Wahrscheinlichkeit, dass eine Einheit bis zum Zeitpunkt t ohne Ausfall funktioniert. Ihr Gegenstück ist die Ausfallwahrscheinlichkeit F(t) = 1 − R(t). Die Ausfallrate λ(t) beschreibt, wie häufig Ausfälle pro Zeiteinheit auftreten, bezogen auf die noch funktionierenden Einheiten. Über die Lebensdauer folgt sie oft der Badewannenkurve: Frühausfälle, eine Phase mit nahezu konstanter Rate und schließlich Verschleiß. Nur in der mittleren Phase gilt das Exponentialmodell R(t) = e^(−λt) mit MTTF = 1/λ. Für Systeme kombiniert man Komponenten: In einer Serienstruktur müssen alle funktionieren, deshalb multipliziert man die Zuverlässigkeiten; in einer Parallelstruktur (Redundanz) genügt eine, deshalb multipliziert man die Ausfallwahrscheinlichkeiten. Fehlerbäume zerlegen ein unerwünschtes Top-Ereignis mit UND- und ODER-Gattern in Basisereignisse. Weiterführend: Weibull-Verteilung, Poisson- und Erneuerungsprozesse, Markov-Modelle und Monte-Carlo-Simulation.",
ar:"الاعتمادية R(t) هي احتمال أن الجهاز يخدم بلا عطل حتى الوقت t، وعكسها احتمال العطل F(t). معدل الأعطال كيتبع غالبا «منحنى الحوض»: أعطال مبكرة، مرحلة ثابتة، ومن بعد التآكل. النموذج الأسي كيصلح غير فالمرحلة الوسطى. فالتركيب على التوالي كنضربو الاعتماديات، وعلى التوازي كنضربو احتمالات العطل."},
tsd:{img:["hydro","pipe"],
de:"In ruhenden Fluiden steigt der Druck linear mit der Tiefe: p = p₀ + ρgh. Der Anteil ρgh heißt Überdruck; mit dem Umgebungsdruck p₀ ergibt sich der Absolutdruck — gib immer an, welchen du meinst. Für strömende, inkompressible Fluide gilt die Kontinuitätsgleichung: Der Volumenstrom Q = A·v bleibt konstant, also wird das Fluid in einer Verengung schneller. Die Bernoulli-Gleichung beschreibt die Energieerhaltung entlang einer Stromlinie (Druck-, Geschwindigkeits- und Höhenenergie). In realen Rohren kommen Druckverluste durch Reibung und Einbauten hinzu. Der thermodynamische Teil behandelt den ersten Hauptsatz (Energiebilanz, ΔU = Q − W), den zweiten Hauptsatz (Entropie), T-s-Diagramme sowie ideale Gase und Gasgemische.",
ar:"فالموائع الساكنة الضغط كيزيد مع العمق p = p₀ + ρgh. فالموائع الجارية، الصبيب Q = A·v ثابت، يعني كلما ضاق الأنبوب كتزيد السرعة. معادلة برنولي هي حفظ الطاقة، وفالأنابيب الحقيقية كاين ضياع بسبب الاحتكاك."},
math:{img:["complex"],
de:"Komplexe Zahlen z = a + jb lassen sich als Punkte oder Zeiger in der Gaußschen Ebene darstellen. Der Betrag |z| ist die Länge des Zeigers, der Winkel θ seine Richtung; daraus folgt die Polarform z = |z|(cos θ + j sin θ) = |z|·e^(jθ). Multiplikation bedeutet dann: Beträge multiplizieren, Winkel addieren. Fourier-Reihen zerlegen periodische Signale in Sinus- und Kosinusanteile, die Fourier-Transformation verallgemeinert das auf nichtperiodische Signale (Frequenzspektrum). Die Laplace-Transformation macht aus linearen Differentialgleichungen algebraische Gleichungen im Bildbereich s: transformieren, Anfangswerte einsetzen, nach der gesuchten Größe auflösen, zurücktransformieren.",
ar:"العدد المركب z = a + jb كيتمثل كسهم فالمستوى: الطول هو |z| والزاوية θ. فورييه كيفكك الإشارة لترددات، ولابلاس كيحول المعادلة التفاضلية لمعادلة جبرية فـ s ساهلة الحل."},
mech:{img:["vt"],
de:"Die Kinematik beschreibt Bewegungen mit Weg, Geschwindigkeit und Beschleunigung — ohne nach den Ursachen zu fragen. Bei konstanter Beschleunigung gelten v = u + at, s = ut + ½at² und v² = u² + 2as. Im v-t-Diagramm ist die Steigung die Beschleunigung und die Fläche unter der Kurve der zurückgelegte Weg. Die Kinetik verbindet die Bewegung mit ihren Ursachen: ΣF = m·a für die Translation und ΣM = I·α für die Drehung starrer Körper. Das Massenträgheitsmoment I hängt nicht nur von der Masse, sondern von ihrer Verteilung um die Drehachse ab (Satz von Steiner). Der Momentanpol ist der Punkt, um den sich ein starrer Körper in einem Augenblick dreht.",
ar:"الكينماتيكا كتوصف الحركة (المسافة، السرعة، التسارع). فمنحنى السرعة-الزمن، الميل هو التسارع والمساحة هي المسافة. الكينيتيكا كتربط الحركة بالقوى: ΣF = ma و ΣM = Iα."},
da:{img:["normal"],
de:"Die Datenanalyse macht aus Mess- und Prüfergebnissen belastbare Aussagen. Zuerst beschreibt man Daten mit Lage- (Mittelwert, Median) und Streuungsmaßen (Varianz, Standardabweichung) und mit Grafiken wie Histogramm oder Boxplot. Die Stichprobenvarianz teilt durch n − 1, damit sie die Varianz der Grundgesamtheit unverzerrt schätzt. Ein Konfidenzintervall gibt einen Bereich an, der den wahren Mittelwert mit einer gewählten Sicherheit (z. B. 95 %) überdeckt; bei kleinen Stichproben verwendet man die t-Verteilung. Beim Hypothesentest unterscheidet man den Fehler 1. Art (eine richtige Nullhypothese verwerfen) und 2. Art (eine falsche Nullhypothese beibehalten). Messsystemanalyse prüft Wiederholbarkeit (gleiche Bedingungen) und Reproduzierbarkeit (andere Prüfer oder Labore) sowie die Messunsicherheit.",
ar:"تحليل البيانات كيبدا بالوصف: المتوسط والانحراف المعياري والرسومات. فترة الثقة كتعطي مجال فيه المتوسط الحقيقي بنسبة ثقة معينة. فالاختبارات كاين خطأ من النوع الأول (رفض فرضية صحيحة) والثاني (قبول فرضية خاطئة)."},
org:{img:["mgmt"],
de:"Organisationen koordinieren Menschen, Prozesse, Verantwortlichkeiten und Kontrollen, um Ziele zu erreichen und gleichzeitig gesetzliche und gesellschaftliche Anforderungen (Compliance) zu erfüllen. Managementsysteme für Qualität, Umwelt sowie Arbeits- und Gesundheitsschutz folgen demselben Regelkreis: Politik und Ziele festlegen, Rollen verteilen, Prozesse gestalten und steuern, Leistung überwachen und auditieren, Korrekturmaßnahmen einleiten und das System regelmäßig durch die Leitung bewerten. Wichtig ist der Unterschied zwischen Korrektur (den Fehler beheben) und Korrekturmaßnahme (die Ursache beseitigen). SIPOC hilft, einen Prozess mit Lieferanten, Eingaben, Prozess, Ergebnissen und Kunden abzugrenzen.",
ar:"أنظمة الإدارة (الجودة، البيئة، السلامة) كتخدم بنفس الدورة: سياسة، أهداف، أدوار، عمليات، مراقبة وتدقيق، إجراءات تصحيحية، ومراجعة من الإدارة. التصحيح كيصلح الخطأ، والإجراء التصحيحي كيزول السبب."},
frm:{img:["ml","split"],
de:"Fortgeschrittene Methoden verbinden Zuverlässigkeitstechnik mit statistischem Lernen. Unüberwachte Verfahren (z. B. Clustering, Hauptkomponentenanalyse) finden Strukturen in Sensordaten ohne Zielgröße. Überwachte Verfahren lernen aus gelabelten Daten, Zustände zu klassifizieren oder Ausfälle vorherzusagen — Grundlage für vorausschauende Instandhaltung (Predictive Maintenance) und die Schätzung der Restlebensdauer (RUL). Entscheidend ist ein sauberer Workflow: Ziel definieren, Daten bereinigen, Merkmale bilden, Daten sinnvoll aufteilen, trainieren, validieren und interpretieren. Bei zeitlich geordneten Daten muss die Aufteilung zeitbewusst erfolgen, sonst entsteht ein Datenleck. Da Ausfälle selten sind, sind Precision, Recall und PR-AUC aussagekräftiger als die reine Genauigkeit.",
ar:"كنستعملو التعلم الآلي باش نتنبأو بالأعطال ونحددو وقت الصيانة. خاص نتبعو مراحل واضحة، ونقسمو البيانات حسب الزمن باش ما يشوفش النموذج المستقبل. وحيت الأعطال قليلة، كنعتمدو على precision/recall عوض accuracy."},
qvp:{img:["qfd","fmea"],
de:"Qualität wird nicht erprüft, sondern geplant — möglichst früh in der Entwicklung, wo Änderungen noch günstig sind. Quality Function Deployment (QFD) übersetzt die Stimme des Kunden in messbare technische Merkmale (House of Quality). Die Design-FMEA analysiert systematisch mögliche Fehlerarten, ihre Folgen und Ursachen sowie vorhandene Vermeidungs- und Entdeckungsmaßnahmen und leitet Verbesserungen ab. Mit Design of Experiments (DoE) untersucht man effizient, welche Faktoren ein Ergebnis beeinflussen. APQP strukturiert die gesamte Qualitätsvorausplanung mit Phasen und Nachweisen bis zum Serienanlauf. Vage Anforderungen wie „leicht zu reinigen“ müssen in prüfbare Kriterien übersetzt werden.",
ar:"الجودة كنخططو ليها من البداية فمرحلة التطوير. QFD كيحول رغبات الزبون لخصائص تقنية قابلة للقياس، FMEA كتحلل الأعطال الممكنة وأسبابها، DoE كيدرس تأثير العوامل، و APQP كينظم كلشي حتى بداية الإنتاج."},
qgd:{img:["vmodel"],
de:"Qualitätsgerechtes Design verbindet Funktion, Sicherheit und Gebrauchstauglichkeit. Design Control führt von den Nutzeranforderungen über Design-Eingaben zu Design-Ergebnissen. Verifizierung prüft, ob die Ergebnisse die Eingaben erfüllen („Haben wir es richtig gebaut?“), Validierung prüft, ob das Produkt für den vorgesehenen Gebrauch geeignet ist („Haben wir das Richtige gebaut?“). Produkt- und Prozesssicherheit identifiziert Gefährdungen und reduziert Risiken durch konstruktive, schützende und hinweisende Maßnahmen. User Experience Design betrachtet die Bedienung: Unklare Alarmprioritäten oder schlecht lesbare Anzeigen sind echte Gefährdungen, besonders in der Medizintechnik.",
ar:"التصميم خاصو يحقق الوظيفة والسلامة وسهولة الاستعمال. التحقق من المطابقة (Verification) كيشوف واش بنينا المنتوج صحيح، والتحقق من الصلاحية (Validation) كيشوف واش بنينا المنتوج الصحيح للاستعمال."},
oe:{img:["pdca"],
de:"Organisationsentwicklung macht Qualität wiederholbar und messbar, indem Prozesse, Rollen, Kultur und Managementsysteme weiterentwickelt werden. Moderne QM-Systeme sind prozessorientiert: Prozesslandkarten zeigen Management-, Kern- und Unterstützungsprozesse und ihre Schnittstellen. Der PDCA-Zyklus ist das Grundmuster jeder Verbesserung: planen, im Kleinen umsetzen, Wirkung prüfen, standardisieren oder neu planen. Ursachenanalyse trennt Symptome von Ursachen. Kennzahlen (KPIs) und Audits zeigen, ob Maßnahmen wirken. Excellence-Modelle wie EFQM bewerten die Organisation ganzheitlich.",
ar:"تطوير المنظمة كيعني نحسنو العمليات والأدوار والثقافة باستمرار. دورة PDCA هي الأساس: خطط، نفذ، تحقق، صحح. والمؤشرات (KPI) والتدقيق كيبينو واش التحسين خدام."},
plc:{img:["lifecycle"],
de:"Produktqualität wird über den gesamten Lebenszyklus gemanagt — vom Konzept über Anforderungen, Design, Verifizierung und Validierung bis zu Produktion, Betrieb, Service und Außerbetriebnahme. Requirements Engineering sorgt für klare, prüfbare Anforderungen; Systems Engineering betrachtet das Produkt als System aus Teilsystemen. Rückverfolgbarkeit verknüpft jede Anforderung mit Designnachweisen und Tests, sodass eine Feldbeanstandung bis zu Version, Charge, Anforderung und Risikoanalyse zurückverfolgt werden kann. Rückmeldungen aus dem Feld fließen in Risikobewertung und Änderungen ein. Design Thinking und systematische Problemlösung unterstützen frühe Phasen und komplexe Situationen.",
ar:"الجودة كترافق المنتوج من الفكرة حتى نهاية عمره. التتبع (Traceability) كيربط كل متطلب بالتصميم والاختبارات، والمعلومات من الميدان كترجع باش نحسنو الجيل الجاي."},
plmse:{img:["ecr"],
de:"Product Lifecycle Management (PLM) verwaltet alle produktbezogenen Informationen und Entscheidungen über den Lebenszyklus. Product Data Management (PDM) ist der Kern davon: CAD-Daten, Stücklisten, Versionen und Freigabestatus. Besonders wichtig ist das Änderungsmanagement: Jede technische Änderung durchläuft Antrag, Auswirkungsanalyse, Risikobewertung, Freigabe, Umsetzung und Verifizierung, bevor sie in Serie geht. Smart Engineering nutzt digitale Modelle, vernetzte Engineering-Daten und integrierte Workflows (z. B. digitaler Zwilling). Die prüfungsrelevanten Inhalte legen die aktuellen Folien der Lehrperson fest.",
ar:"PLM كيدبر جميع معلومات المنتوج عبر حياتو، و PDM كيركز على البيانات (CAD، قوائم القطع، النسخ). كل تعديل تقني خاصو يدوز من طلب، تحليل الأثر، تقييم المخاطر، الموافقة، التنفيذ والتحقق."}

const CLONG={
ssgb:[["dmaic","Ein Six-Sigma-Projekt folgt dem DMAIC-Zyklus. In Define werden Problem, Ziel, Umfang und Kundenanforderungen (VOC → CTQ) im Projektauftrag festgehalten; SIPOC grenzt den Prozess ab. In Measure wird zuerst das Messsystem geprüft (Gage R&R), dann die Ausgangsleistung gemessen. Analyze sucht die Grundursachen mit Ishikawa, 5 Why, Pareto, Hypothesentests oder Regression. Improve entwickelt und testet Lösungen, oft mit Versuchsplanung (DoE) und Pilotversuchen. Control sichert die Verbesserung mit Regelplan, SPC und Standards und übergibt den Prozess an den Prozesseigner."],
 ["sigma","Six Sigma misst Fehler pro Million Möglichkeiten (DPMO). DPU sind Fehler pro Einheit; DPMO berücksichtigt zusätzlich, wie viele Fehlermöglichkeiten jede Einheit hat. Das Sigma-Niveau übersetzt DPMO in eine Kennzahl; üblich ist eine langfristige Verschiebung um 1,5σ, sodass 6σ etwa 3,4 DPMO entsprechen. Der Rolled Throughput Yield (RTY) ist das Produkt der Ausbeuten aller Prozessschritte und zeigt, wie viele Einheiten den gesamten Prozess fehlerfrei durchlaufen."],
 ["cpk","Prozessfähigkeitsindizes vergleichen die natürliche Prozessstreuung (6σ) mit der Toleranz (USL − LSL). Cp betrachtet nur die Streuung, Cpk zusätzlich die Lage des Mittelwerts relativ zur näheren Grenze. Ist Cp gut, Cpk aber schlecht, liegt der Prozess außermittig — dann hilft Zentrieren mehr als Streuung verringern. Häufig wird Cpk ≥ 1,33 gefordert. Fähigkeitsindizes sind nur für stabile, beherrschte Prozesse sinnvoll."],
 ["control","Jeder Prozess streut. Zufällige Streuung (gemeinsame Ursachen) gehört zum System; besondere Ursachen sind ungewöhnlich und müssen untersucht werden. Regelkarten zeigen den Verlauf einer Kenngröße mit Mittellinie und Eingriffsgrenzen bei etwa ±3σ aus Prozessdaten — sie sind keine Toleranzgrenzen. Punkte außerhalb der Grenzen oder auffällige Muster (Läufe, Trends) deuten auf besondere Ursachen. Für messbare Merkmale nutzt man x̄-R- oder x̄-s-Karten, für zählbare Merkmale p-, np-, c- oder u-Karten."],
 ["ishikawa","Die sieben Qualitätswerkzeuge sind einfache, grafische Hilfsmittel zur Problemanalyse: Fehlersammelliste, Histogramm, Pareto-Diagramm, Ursache-Wirkungs-Diagramm (Ishikawa), Korrelationsdiagramm, Regelkarte und Flussdiagramm bzw. Stratifizierung. Das Pareto-Prinzip lenkt den Blick auf die wenigen wichtigen Ursachen. Das Ishikawa-Diagramm ordnet mögliche Ursachen nach den 6 M: Mensch, Maschine, Methode, Material, Messung und Mitwelt."]],
dgq:[["isoFam","Die ISO-9000-Familie besteht aus mehreren Normen mit unterschiedlichen Rollen. ISO 9000 erklärt Grundlagen und Begriffe. ISO 9001 enthält die Anforderungen an ein Qualitätsmanagementsystem und ist die einzige zertifizierbare Norm der Familie. ISO 9004 gibt Anleitung für nachhaltigen Erfolg über die Mindestanforderungen hinaus. ISO 19011 ist der Leitfaden für Audits von Managementsystemen."],
 ["principles","ISO 9000 nennt sieben Grundsätze des Qualitätsmanagements: Kundenorientierung, Führung, Engagement von Personen, prozessorientierter Ansatz, Verbesserung, faktengestützte Entscheidungsfindung und Beziehungsmanagement. Sie sind die Philosophie hinter den Anforderungen der ISO 9001 und tauchen in Prüfungen oft als Zuordnungsfragen auf."],
 ["hls","ISO 9001:2015 folgt der High Level Structure mit den Kapiteln 4 bis 10, die sich dem PDCA-Zyklus zuordnen lassen. Kapitel 4 (Kontext) und 5 (Führung) bilden den Rahmen. Kapitel 6 (Planung) ist PLAN, 7 (Unterstützung) und 8 (Betrieb) sind DO, 9 (Bewertung der Leistung mit internem Audit 9.2 und Managementbewertung 9.3) ist CHECK, 10 (Verbesserung) ist ACT."],
 ["pdca","Drei Kernkonzepte tragen die ISO 9001: der prozessorientierte Ansatz, der PDCA-Zyklus und risikobasiertes Denken. Seit 2015 ersetzt der Begriff „dokumentierte Information“ die früheren Dokumente und Aufzeichnungen. Qualität ist nach ISO 9000 der Grad, in dem inhärente Merkmale Anforderungen erfüllen; eine Nichtkonformität ist die Nichterfüllung einer Anforderung."]],
taw:[["parties","Audits unterscheidet man nach Auftraggeber und Gegenstand. Erstparteien-Audits sind interne Audits der Organisation selbst. Zweitparteien-Audits führt ein Kunde bei seinem Lieferanten durch — das klassische Lieferantenaudit. Drittparteien-Audits macht eine unabhängige Zertifizierungsstelle. Nach Gegenstand gibt es Systemaudits (Managementsystem gegen Norm), Prozessaudits (Fähigkeit und Wirksamkeit eines Prozesses, z. B. VDA 6.3) und Produktaudits (fertige Produkte aus Kundensicht)."],
 ["auditTerms","ISO 19011 definiert die Grundbegriffe: Auditkriterien sind die Anforderungen, gegen die geprüft wird (Norm, Vertrag, Verfahren). Auditnachweise sind verifizierbare Aufzeichnungen und Tatsachenfeststellungen. Durch den Vergleich der Nachweise mit den Kriterien entstehen Auditfeststellungen (Konformität oder Abweichung). Die Auditschlussfolgerung ist das Gesamtergebnis unter Berücksichtigung der Auditziele. Auditprinzipien sind u. a. Integrität, sachliche Darstellung, Sorgfalt, Vertraulichkeit, Unabhängigkeit sowie ein nachweis- und risikobasierter Ansatz."],
 ["auditFlow","Ein Audit beginnt mit dem Auditprogramm und der Planung einzelner Audits: Ziele, Umfang, Kriterien, Team, Zeitplan, Dokumentenprüfung und Checklisten. Im Eröffnungsgespräch werden Umfang, Ablauf und Kommunikation bestätigt. Dann sammelt das Team Nachweise durch Befragung mit offenen Fragen („Wie…? Zeigen Sie mir…“), Beobachtung und Einsicht in Aufzeichnungen — stichprobenartig. Im Abschlussgespräch werden Feststellungen vorgestellt. Es folgen Bericht, Korrekturmaßnahmen des Lieferanten und die Überprüfung ihrer Wirksamkeit (Follow-up)."],
 ["findings","Feststellungen werden eingestuft: Eine Hauptabweichung liegt vor, wenn eine Anforderung fehlt oder vollständig versagt und das System gefährdet ist. Eine Nebenabweichung ist ein einzelner Fehler, das System funktioniert grundsätzlich. Beobachtungen oder Verbesserungspotenziale verletzen keine Anforderung. Auf Reklamationen antworten Lieferanten häufig mit einem 8D-Report, der von der Teambildung (D1) bis zum Abschluss (D8) systematisch zur Ursache und zur dauerhaften Abstellung führt."],
 ["abc","Lieferanten werden vor der Auftragsvergabe (Potenzialanalyse) und laufend bewertet. Typische Kriterien sind Qualität (ppm, Reklamationen), Liefertreue, Preis, Service und Zusammenarbeit. Aus der Punktzahl ergibt sich eine Klassifizierung, z. B. A (bevorzugt), B (mit Entwicklungsbedarf), C (kritisch). Anlässe für ein Audit sind neue Lieferanten, wiederholte Reklamationen oder Prozess- und Standortänderungen. Vor dem Serienstart bestätigt die Erstmusterprüfung (PPAP), dass der Serienprozess die Anforderungen erfüllt."]],
jea:[["efqm","Das EFQM-Modell 2020 betrachtet eine Organisation in drei Teilen: Richtung (Warum? — Zweck, Vision und Strategie; Organisationskultur und Führung), Umsetzung (Wie? — Stakeholder einbinden; nachhaltigen Wert schaffen; Leistungsfähigkeit und Transformation vorantreiben) und Ergebnisse (Was? — Wahrnehmung der Stakeholder; strategische und operative Leistung). Insgesamt sind bis zu 1000 Punkte möglich."],
 ["radar","RADAR ist die Bewertungslogik: Results — welche Ergebnisse sollen erreicht werden? Approaches — gibt es fundierte, integrierte Vorgehensweisen? Deploy — werden sie systematisch umgesetzt? Assess & Refine — werden sie gemessen, gelernt und verbessert? Ergebnisse werden nach Relevanz und Nutzbarkeit sowie nach Leistung beurteilt: Trends, Ziele, Vergleiche und Ursachen."],
 ["selfA","Eine Selbstbewertung soll Stärken und Verbesserungspotenziale zeigen, nicht bestehen oder durchfallen. Assessor:innen bewerten zunächst einzeln, einigen sich dann im Konsensmeeting und erstellen Punktzahl und Feedbackbericht. Methoden sind Fragebogen, Workshop, Pro-Forma oder eine vollständige Preis-Simulation. Benchmarking vergleicht mit den Besten. Wichtig: Excellence-Modelle sind ganzheitliche Reifegradbewertungen, keine Konformitätszertifizierung wie ISO 9001."],
 [null,"Der Ludwig-Erhard-Preis ist der deutsche Excellence-Preis der Initiative Ludwig-Erhard-Preis e.V. (ILEP). Die Bewertung basierte lange auf dem EFQM-Modell; die ILEP hat zudem das „Excellence Framework Europe“ mitentwickelt. Kläre im Kurs, welches Modell verwendet wird."]]
};

 const pref={de:["anna","helena","petra","markus","martin","google deutsch"],fr:["thomas","amélie","amelie","audrey","google français"],en:["samantha","daniel","karen","google us english"]}[l2]||[];

function speak(text,lang,btn){
  try{const ss=window.speechSynthesis;if(!ss){toast("Sprachausgabe nicht verfügbar");return;}
    if(speaking){ss.cancel();const was=speaking;speaking=null;document.querySelectorAll(".spk.on").forEach(b=>{b.classList.remove("on");b.innerHTML="🔊 "+t("listen");});if(was===btn)return;}
    ss.cancel();
    const loc={de:"de-DE",fr:"fr-FR",en:"en-US"}[lang]||"de-DE";
    const v=pickVoice(loc);
    if(!v){const h=VOICE_HELP[lang]||VOICE_HELP.de;showVoiceHelp(h);return;}
    const parts=String(text).replace(/\s+/g," ").match(/[^.!?]+[.!?]?/g)||[text];
    parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.trim());u.voice=v;u.lang=v.lang||loc;u.rate=S.rate||0.95;if(i===parts.length-1)u.onend=()=>{speaking=null;if(btn){btn.classList.remove("on");btn.innerHTML="🔊 "+t("listen");}};ss.speak(u);});
    speaking=btn;if(btn){btn.classList.add("on");btn.innerHTML="⏹ "+t("stop");}
  }catch(e){toast("TTS error");}
}

    const blob=await html2pdf().set({margin:[12,12,14,12],image:{type:"jpeg",quality:.92},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"],before:".pgb",avoid:[".fig",".formula",".example","li","p"]}}).from(box).outputPdf("blob");
    wrap.remove();

  }catch(e){if(!(e&&e.code==="declined"))toast("PDF: "+(e&&e.code||e&&e.message||"error"));document.querySelectorAll(".pdfwrap").forEach(x=>x.remove());}
  if(btn){btn.disabled=false;btn.innerHTML=old;}
}

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)],r2=(x,d=3)=>+x.toFixed(d);

{mod:"tz",f(){const k=rnd(1,9),e=pick([3,4,5]),l=k*Math.pow(10,-e),t=pick([100,200,500,1000,2000,5000]);const R=Math.exp(-l*t);return {q:[`λ = ${k}·10⁻${"⁰¹²³⁴⁵⁶"[e]} h⁻¹ (konstant), t = ${t} h. Berechne die Zuverlässigkeit R(t).`,`λ = ${k}·10⁻${"⁰¹²³⁴⁵⁶"[e]} h⁻¹ (constant), t = ${t} h. Compute R(t).`],a:R,tol:.002,u:"",sol:`λt = ${nf(l*t,5)} → R = e^(−${nf(l*t,5)}) = ${nf(R)}`};}},
{mod:"tz",f(){const k=rnd(1,9),e=pick([3,4,5]),l=k*Math.pow(10,-e);return {q:[`Konstante Ausfallrate λ = ${k}·10⁻${"⁰¹²³⁴⁵⁶"[e]} h⁻¹. Wie groß ist die MTTF in Stunden?`,`Constant failure rate λ = ${k}·10⁻${"⁰¹²³⁴⁵⁶"[e]} h⁻¹. What is the MTTF in hours?`],a:1/l,tol:.005,rel:1,u:"h",sol:`MTTF = 1/λ = ${nf(1/l,1)} h`};}},
{mod:"tz",f(){const n=rnd(2,4),R=Array.from({length:n},()=>r2(0.85+Math.random()*0.14,2));const v=R.reduce((a,b)=>a*b,1);return {q:[`${n} unabhängige Komponenten in Serie: R = ${R.map(x=>nf(x,2)).join(" · ")}. System-Zuverlässigkeit?`,`${n} independent components in series: R = ${R.join(", ")}. System reliability?`],a:v,tol:.002,sol:`R_sys = ${R.map(x=>nf(x,2)).join(" × ")} = ${nf(v)}`};}},
{mod:"tz",f(){const n=rnd(2,3),R=Array.from({length:n},()=>r2(0.6+Math.random()*0.35,2));const v=1-R.reduce((a,b)=>a*(1-b),1);return {q:[`${n} unabhängige Komponenten parallel (Redundanz): R = ${R.map(x=>nf(x,2)).join(" · ")}. System-Zuverlässigkeit?`,`${n} independent components in parallel: R = ${R.join(", ")}. System reliability?`],a:v,tol:.002,sol:`R_sys = 1 − ${R.map(x=>"(1−"+nf(x,2)+")").join("·")} = ${nf(v)}`};}},
{mod:"tsd",f(){const h=rnd(1,40)/2,rho=pick([1000,1000,1025,800]);const p=rho*9.81*h/1000;return {q:[`Fluid mit ρ = ${rho} kg/m³, Tiefe h = ${nf(h,1)} m, g = 9,81 m/s². Überdruck in kPa?`,`Fluid ρ = ${rho} kg/m³, depth h = ${h} m, g = 9.81 m/s². Gauge pressure in kPa?`],a:p,tol:.01,rel:1,u:"kPa",sol:`p = ρgh = ${rho}·9,81·${nf(h,1)} = ${nf(p*1000,1)} Pa = ${nf(p,3)} kPa`};}},
{mod:"tsd",f(){const A1=rnd(2,12),A2=rnd(1,A1-1)||1,v1=rnd(1,8)/2;const v2=A1*v1/A2;return {q:[`Rohr: A₁ = ${A1} cm², v₁ = ${nf(v1,1)} m/s, A₂ = ${A2} cm². Geschwindigkeit v₂ in m/s?`,`Pipe: A₁ = ${A1} cm², v₁ = ${v1} m/s, A₂ = ${A2} cm². Velocity v₂ in m/s?`],a:v2,tol:.01,rel:1,u:"m/s",sol:`v₂ = A₁·v₁/A₂ = ${A1}·${nf(v1,1)}/${A2} = ${nf(v2,3)} m/s`};}},

let IDB=null;
function idb(){if(IDB)return IDB;IDB=new Promise((res,rej)=>{try{const r=indexedDB.open("mqz-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});return IDB;}
async function fAll(){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction("f").objectStore("f").getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>b.at-a.at));q.onerror=()=>rej(q.error);});}
async function fPut(o){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction("f","readwrite");tx.objectStore("f").put(o);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function fDel(id){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction("f","readwrite");tx.objectStore("f").delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}

const LONG2={
tz:{en:"Reliability R(t) is the probability that an item works without failure up to time t; its complement is the failure probability F(t) = 1 − R(t). The failure rate λ(t) describes how often failures occur per unit of time among the units still working. Over the lifetime it often follows the bathtub curve: early failures, a phase with an almost constant rate, and finally wear-out. Only in the middle phase does the exponential model R(t) = e^(−λt) with MTTF = 1/λ apply. For systems, components are combined: in a series structure all must work, so reliabilities are multiplied; in a parallel (redundant) structure one is enough, so failure probabilities are multiplied. Fault trees break an undesired top event down into basic events using AND and OR gates. Further topics: Weibull distribution, Poisson and renewal processes, Markov models and Monte Carlo simulation.",
 fr:"La fiabilité R(t) est la probabilité qu'un élément fonctionne sans défaillance jusqu'à l'instant t ; son complément est la probabilité de défaillance F(t) = 1 − R(t). Le taux de défaillance λ(t) indique la fréquence des pannes par unité de temps parmi les unités encore en fonctionnement. Sur la durée de vie, il suit souvent la courbe en baignoire : défaillances précoces, phase à taux presque constant, puis usure. Le modèle exponentiel R(t) = e^(−λt) avec MTTF = 1/λ ne s'applique qu'à la phase centrale. Pour un système en série, tous les composants doivent fonctionner : on multiplie les fiabilités ; en parallèle (redondance), un seul suffit : on multiplie les probabilités de défaillance. Les arbres de défaillances décomposent un événement redouté en événements de base avec des portes ET et OU."},
tsd:{en:"In fluids at rest, pressure increases linearly with depth: p = p₀ + ρgh. The part ρgh is the gauge pressure; adding the ambient pressure p₀ gives the absolute pressure — always state which one you mean. For flowing incompressible fluids the continuity equation holds: the volume flow Q = A·v stays constant, so the fluid speeds up in a narrowing. The Bernoulli equation expresses energy conservation along a streamline (pressure, velocity and height energy). In real pipes, pressure losses due to friction and fittings are added. The thermodynamic part covers the first law (energy balance, ΔU = Q − W), the second law (entropy), T-s diagrams and ideal gases and gas mixtures.",
 fr:"Dans un fluide au repos, la pression augmente linéairement avec la profondeur : p = p₀ + ρgh. La part ρgh est la pression relative ; en ajoutant la pression ambiante p₀, on obtient la pression absolue — précisez toujours laquelle. Pour un fluide incompressible en écoulement, l'équation de continuité s'applique : le débit Q = A·v reste constant, donc le fluide accélère dans un rétrécissement. L'équation de Bernoulli traduit la conservation de l'énergie le long d'une ligne de courant. Dans les conduites réelles s'ajoutent des pertes de charge dues au frottement et aux singularités. La partie thermodynamique traite du premier principe, du second principe (entropie), des diagrammes T-s et des gaz parfaits."},
math:{en:"Complex numbers z = a + jb can be drawn as points or phasors in the complex plane. The magnitude |z| is the length of the phasor and the angle θ its direction; this gives the polar form z = |z|(cos θ + j sin θ) = |z|·e^(jθ). Multiplication then means multiplying magnitudes and adding angles. Fourier series decompose periodic signals into sine and cosine components; the Fourier transform extends this to non-periodic signals (frequency spectrum). The Laplace transform turns linear differential equations into algebraic equations in the s-domain: transform, insert initial conditions, solve for the unknown, transform back.",
 fr:"Les nombres complexes z = a + jb se représentent comme des points ou des vecteurs dans le plan complexe. Le module |z| est la longueur du vecteur et l'argument θ sa direction ; d'où la forme polaire z = |z|(cos θ + j sin θ) = |z|·e^(jθ). Multiplier revient alors à multiplier les modules et additionner les arguments. Les séries de Fourier décomposent un signal périodique en sinus et cosinus ; la transformée de Fourier généralise aux signaux non périodiques. La transformée de Laplace transforme une équation différentielle linéaire en équation algébrique en s : transformer, introduire les conditions initiales, résoudre, puis revenir au domaine temporel."},
mech:{en:"Kinematics describes motion through displacement, velocity and acceleration — without asking about its causes. For constant acceleration: v = u + at, s = ut + ½at² and v² = u² + 2as. In a velocity-time diagram the slope is the acceleration and the area under the curve is the distance travelled. Kinetics links motion to its causes: ΣF = m·a for translation and ΣM = I·α for the rotation of rigid bodies. The mass moment of inertia I depends not only on the mass but on how it is distributed around the axis (parallel-axis theorem). The instantaneous centre is the point about which a rigid body rotates at a given instant.",
 fr:"La cinématique décrit le mouvement par le déplacement, la vitesse et l'accélération, sans s'intéresser aux causes. À accélération constante : v = u + at, s = ut + ½at² et v² = u² + 2as. Dans un diagramme vitesse-temps, la pente est l'accélération et l'aire sous la courbe la distance parcourue. La cinétique relie le mouvement à ses causes : ΣF = m·a en translation et ΣM = I·α en rotation d'un solide. Le moment d'inertie I dépend de la masse et de sa répartition autour de l'axe (théorème de Huygens). Le centre instantané de rotation est le point autour duquel le solide tourne à un instant donné."},
da:{en:"Data analysis turns measurement and test results into reliable statements. First, data are described with location measures (mean, median), spread measures (variance, standard deviation) and plots such as histograms or box plots. The sample variance divides by n − 1 so that it estimates the population variance without bias. A confidence interval gives a range that covers the true mean with a chosen confidence (e.g. 95 %); for small samples the t distribution is used. In hypothesis testing there is the Type I error (rejecting a true null hypothesis) and the Type II error (keeping a false one). Measurement system analysis checks repeatability (same conditions), reproducibility (other operators or labs) and measurement uncertainty.",
 fr:"L'analyse des données transforme des mesures et essais en conclusions fiables. On décrit d'abord les données par des indicateurs de position (moyenne, médiane), de dispersion (variance, écart-type) et des graphiques (histogramme, boîte à moustaches). La variance d'échantillon divise par n − 1 pour estimer sans biais la variance de la population. Un intervalle de confiance donne une plage qui contient la vraie moyenne avec une confiance choisie (par ex. 95 %) ; pour de petits échantillons on utilise la loi de Student. En test d'hypothèse, on distingue l'erreur de première espèce (rejeter une hypothèse nulle vraie) et de seconde espèce (conserver une hypothèse fausse). L'analyse du système de mesure vérifie répétabilité, reproductibilité et incertitude."},
org:{en:"Organisations coordinate people, processes, responsibilities and controls to reach objectives while meeting legal and social requirements (compliance). Management systems for quality, environment and occupational health and safety follow the same control loop: set policy and objectives, assign roles, design and control processes, monitor and audit performance, take corrective action, and have top management review the system regularly. The difference between correction (fixing the defect) and corrective action (removing the cause) is important. SIPOC helps to delimit a process with suppliers, inputs, process, outputs and customers.",
 fr:"Les organisations coordonnent personnes, processus, responsabilités et contrôles pour atteindre leurs objectifs tout en respectant les exigences légales et sociales (conformité). Les systèmes de management qualité, environnement et santé-sécurité suivent la même boucle : définir politique et objectifs, attribuer les rôles, concevoir et piloter les processus, surveiller et auditer, engager des actions correctives et faire revoir le système par la direction. Il faut distinguer la correction (réparer le défaut) de l'action corrective (supprimer la cause). Le SIPOC délimite un processus : fournisseurs, entrées, processus, sorties, clients."},
frm:{en:"Advanced methods combine reliability engineering with statistical learning. Unsupervised methods (e.g. clustering, principal component analysis) find structure in sensor data without a target variable. Supervised methods learn from labelled data to classify conditions or predict failures — the basis of predictive maintenance and remaining useful life (RUL) estimation. A clean workflow is essential: define the target, clean the data, build features, split the data properly, train, validate and interpret. With time-ordered data the split must be time-aware, otherwise data leakage occurs. Because failures are rare, precision, recall and PR-AUC are more meaningful than plain accuracy.",
 fr:"Les méthodes avancées combinent fiabilité et apprentissage statistique. Les méthodes non supervisées (clustering, analyse en composantes principales) trouvent des structures dans les données de capteurs sans variable cible. Les méthodes supervisées apprennent à partir de données étiquetées pour classer des états ou prédire des pannes — base de la maintenance prédictive et de l'estimation de la durée de vie résiduelle (RUL). Un flux de travail rigoureux est indispensable : définir la cible, nettoyer, construire des variables, découper correctement, entraîner, valider et interpréter. Avec des données temporelles, le découpage doit respecter le temps, sinon il y a fuite de données. Les pannes étant rares, précision, rappel et PR-AUC sont plus parlants que l'exactitude."},
qvp:{en:"Quality is not inspected in, it is planned — as early as possible in development, where changes are still cheap. Quality Function Deployment (QFD) translates the voice of the customer into measurable technical characteristics (House of Quality). The design FMEA systematically analyses possible failure modes, their effects and causes, and existing prevention and detection controls, and derives improvements. Design of Experiments (DoE) efficiently investigates which factors influence a result. APQP structures the whole advanced quality planning with phases and evidence up to series launch. Vague requirements such as 'easy to clean' must be translated into testable criteria.",
 fr:"La qualité ne se contrôle pas après coup, elle se planifie — le plus tôt possible dans le développement, quand les modifications coûtent peu. Le QFD traduit la voix du client en caractéristiques techniques mesurables (maison de la qualité). L'AMDEC produit analyse systématiquement les modes de défaillance, leurs effets et causes, ainsi que les moyens de prévention et de détection, et en déduit des améliorations. Les plans d'expériences (DoE) identifient efficacement les facteurs influents. L'APQP structure toute la planification qualité jusqu'au lancement en série. Une exigence floue comme « facile à nettoyer » doit devenir un critère vérifiable."},
qgd:{en:"Quality-oriented design combines function, safety and usability. Design control leads from user needs through design inputs to design outputs. Verification checks whether outputs meet inputs ('Did we build it right?'); validation checks whether the product is suitable for its intended use ('Did we build the right thing?'). Product and process safety identifies hazards and reduces risks by inherently safe design, protective measures and information for use. User experience design looks at operation: unclear alarm priorities or poorly readable displays are real hazards, especially in medical technology.",
 fr:"La conception orientée qualité réunit fonction, sécurité et facilité d'utilisation. La maîtrise de la conception va des besoins utilisateurs aux données d'entrée puis aux données de sortie. La vérification contrôle que les sorties satisfont les entrées (« l'avons-nous bien construit ? ») ; la validation contrôle l'adéquation à l'usage prévu (« avons-nous construit le bon produit ? »). La sécurité produit et procédé identifie les dangers et réduit les risques par conception, protection et information. Le design de l'expérience utilisateur s'intéresse à l'utilisation : des priorités d'alarme confuses ou un affichage illisible sont de vrais dangers, surtout en technologie médicale."},
oe:{en:"Organisation development makes quality repeatable and measurable by developing processes, roles, culture and management systems. Modern quality management systems are process-oriented: process maps show management, core and support processes and their interfaces. The PDCA cycle is the basic pattern of every improvement: plan, implement on a small scale, check the effect, then standardise or plan again. Root-cause analysis separates symptoms from causes. Key performance indicators and audits show whether measures work. Excellence models such as EFQM assess the organisation holistically.",
 fr:"Le développement organisationnel rend la qualité reproductible et mesurable en faisant évoluer processus, rôles, culture et systèmes de management. Les systèmes qualité modernes sont orientés processus : la cartographie montre les processus de management, de réalisation et de support et leurs interfaces. Le cycle PDCA est le schéma de toute amélioration : planifier, tester à petite échelle, vérifier l'effet, puis standardiser ou replanifier. L'analyse des causes distingue symptômes et causes. Les indicateurs et les audits montrent si les mesures sont efficaces. Les modèles d'excellence comme l'EFQM évaluent l'organisation de façon globale."},
plc:{en:"Product quality is managed across the whole lifecycle — from concept, requirements, design, verification and validation to production, operation, service and retirement. Requirements engineering ensures clear, testable requirements; systems engineering treats the product as a system of subsystems. Traceability links every requirement to design evidence and tests, so that a field complaint can be traced back to version, batch, requirement and risk analysis. Feedback from the field flows into risk assessment and changes. Design thinking and systematic problem solving support early phases and complex situations.",
 fr:"La qualité du produit se gère sur tout le cycle de vie — du concept, des exigences, de la conception, de la vérification et validation jusqu'à la production, l'exploitation, le service et le retrait. L'ingénierie des exigences garantit des exigences claires et vérifiables ; l'ingénierie système considère le produit comme un système de sous-systèmes. La traçabilité relie chaque exigence aux preuves de conception et aux essais, si bien qu'une réclamation terrain peut remonter à la version, au lot, à l'exigence et à l'analyse de risques. Le retour terrain alimente l'évaluation des risques et les modifications."},
plmse:{en:"Product Lifecycle Management (PLM) manages all product-related information and decisions across the lifecycle. Product Data Management (PDM) is its core: CAD data, bills of materials, versions and release status. Change management is particularly important: every engineering change goes through request, impact analysis, risk assessment, approval, implementation and verification before it reaches series production. Smart engineering uses digital models, connected engineering data and integrated workflows, for example a digital twin. The examinable content is defined by the lecturer's current slides.",
 fr:"Le PLM gère toutes les informations et décisions liées au produit sur son cycle de vie. Le PDM en est le cœur : données CAO, nomenclatures, versions et statuts de validation. La gestion des modifications est essentielle : chaque modification technique passe par une demande, une analyse d'impact, une évaluation des risques, une approbation, une mise en œuvre et une vérification avant la série. Le Smart Engineering utilise des modèles numériques, des données d'ingénierie connectées et des flux intégrés, par exemple le jumeau numérique. Le contenu d'examen est défini par les supports actuels de l'enseignant."}
};

const CFR={
ssgb:["Un projet Six Sigma suit le cycle DMAIC : Définir le problème et les exigences client, Mesurer après avoir validé le système de mesure, Analyser les causes racines, Innover/améliorer avec des solutions testées, puis Contrôler pour pérenniser les gains avec un plan de surveillance et la MSP.","Six Sigma mesure les défauts par million d'opportunités (DPMO). Le niveau sigma traduit ce chiffre ; avec le décalage de 1,5σ, 6σ correspond à environ 3,4 DPMO. Le rendement cumulé (RTY) est le produit des rendements de chaque étape.","Les indices de capabilité comparent la dispersion naturelle (6σ) à la tolérance. Cp ne regarde que la dispersion, Cpk tient aussi compte du centrage. Si Cp est bon mais Cpk faible, le procédé est décentré. On exige souvent Cpk ≥ 1,33, pour un procédé stable.","Tout procédé varie. Les causes communes font partie du système ; les causes spéciales sont inhabituelles et doivent être analysées. Les cartes de contrôle ont des limites à environ ±3σ calculées sur les données du procédé — ce ne sont pas des tolérances.","Les sept outils de la qualité : feuille de relevé, histogramme, Pareto, diagramme d'Ishikawa, diagramme de corrélation, carte de contrôle et logigramme. Ishikawa classe les causes selon les 6M : main-d'œuvre, machine, méthode, matière, mesure, milieu."],
dgq:["La famille ISO 9000 : ISO 9000 pour les principes et le vocabulaire, ISO 9001 pour les exigences certifiables, ISO 9004 pour le succès durable, ISO 19011 pour l'audit des systèmes de management.","ISO 9000 définit sept principes : orientation client, leadership, implication du personnel, approche processus, amélioration, prise de décision fondée sur des preuves et management des relations avec les parties intéressées.","ISO 9001:2015 suit la structure de haut niveau, chapitres 4 à 10, alignés sur le PDCA : 6 Planification = Plan ; 7 Support et 8 Réalisation = Do ; 9 Évaluation des performances = Check ; 10 Amélioration = Act.","Trois concepts clés : approche processus, cycle PDCA et approche par les risques. Les « informations documentées » remplacent documents et enregistrements. Une non-conformité est le non-respect d'une exigence."],
taw:["On distingue les audits de première partie (internes), de seconde partie (client chez son fournisseur) et de tierce partie (organisme de certification indépendant), ainsi que les audits système, processus et produit.","ISO 19011 définit les critères d'audit (référentiel), les preuves d'audit (vérifiables), les constats (conformité ou écart) et la conclusion d'audit. Principes : intégrité, impartialité, indépendance et approche fondée sur la preuve et sur les risques.","Un audit se déroule ainsi : programme, préparation et liste de contrôle, réunion d'ouverture, collecte de preuves par entretien avec questions ouvertes, observation et échantillonnage, réunion de clôture, rapport, actions correctives et suivi de leur efficacité.","Les constats sont classés : non-conformité majeure (exigence absente ou défaillance totale), mineure (écart isolé) et observation ou piste d'amélioration. Les fournisseurs répondent souvent aux réclamations par un rapport 8D.","Les fournisseurs sont évalués avant attribution (analyse de potentiel) puis en continu selon la qualité, le respect des délais, le prix et le service, et classés A, B ou C. L'inspection des premiers échantillons confirme le procédé avant la série."],
jea:["Le modèle EFQM 2020 comporte trois parties : Direction (raison d'être, vision, stratégie ; culture et leadership), Exécution (impliquer les parties prenantes ; créer une valeur durable ; piloter la performance et la transformation) et Résultats (perceptions des parties prenantes ; performance stratégique et opérationnelle), pour 1000 points au maximum.","RADAR est la logique d'évaluation : Résultats visés, Approches solides, Déploiement systématique, puis Évaluation et Amélioration. Les résultats sont jugés sur leur pertinence et leur performance : tendances, cibles, comparaisons et causes.","L'auto-évaluation vise à identifier forces et axes de progrès. Les évaluateurs notent d'abord individuellement, puis se mettent d'accord en réunion de consensus et rédigent un rapport. Un modèle d'excellence n'est pas une certification de conformité comme ISO 9001.","Le prix Ludwig-Erhard est le prix allemand de l'excellence, décerné par l'ILEP. Son évaluation reposait sur le modèle EFQM ; l'ILEP a aussi co-développé l'Excellence Framework Europe."]
};
